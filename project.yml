# XcodeGen spec for the native SwiftUI front end.
# Regenerate the project after editing:  xcodegen generate
# The SwiftUI app drives the Python engine (SuperJoy_Slating_App.py) through
# slate_worker.py, which is bundled in Contents/Resources with its presets and templates.
name: SlateWorkstation
options:
  bundleIdPrefix: com.superjoy
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 43LRM27435
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    INFOPLIST_FILE: App/Info.plist
    CODE_SIGN_ENTITLEMENTS: App/App.entitlements
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
  configs:
    # Debug keeps Xcode's automatic Apple Development signing for Run from Xcode.
    # Release is signed for distribution outside the App Store with the Developer ID certificate.
    Release:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Developer ID Application"
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
      # Xcode otherwise adds the get-task-allow (debugger) entitlement, which notarization rejects.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

targetTemplates:
  SlateApp:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ["Info.plist", "App.entitlements"]
      - Shared
      # Python engine + resources it resolves relative to its own folder (_APP_DIR)
      - path: engine/SuperJoy_Slating_App.py
        buildPhase: resources
      - path: engine/slate_worker.py
        buildPhase: resources
      - path: engine/presets
        type: folder
        buildPhase: resources
      - path: "engine/sj_Slates From Spreadsheet_Template_006.aep"
        buildPhase: resources
      - path: "engine/sj_Slates From Spreadsheet_Template_005.aep"
        buildPhase: resources
      - path: "engine/Slates From Spreadsheet_Template_001.xlsx"
        buildPhase: resources
      - path: engine/make_contact_sheet.py
        buildPhase: resources
      - path: engine/readme.txt
        buildPhase: resources
    postBuildScripts:
      # Copies vendor/python (staged from uv's python-build-standalone) into
      # Contents/Resources/python and signs it; Xcode then signs the app.
      - name: Embed Python Runtime
        script: exec "$SRCROOT/scripts/embed_python_runtime.sh" slate
        basedOnDependencyAnalysis: false
      # LGPL ffmpeg/ffprobe (scripts/build_ffmpeg.sh) -> Contents/Helpers; used for the H.264 slate pass
      - name: Embed ffmpeg
        script: exec "$SRCROOT/scripts/embed_ffmpeg.sh"
        basedOnDependencyAnalysis: false

  # Companion app: media ingest (read-only scanner + camera reports for now).
  # Shares Shared/ (theme, Python worker, console) with the slate apps; its own UI in IngestApp/.
  IngestApp:
    type: application
    platform: macOS
    settings:
      base:
        INFOPLIST_FILE: IngestApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: IngestApp/App.entitlements
    sources:
      - path: IngestApp
        excludes: ["Info.plist", "App.entitlements"]
      - Shared
      - path: engine/ingest_worker.py
        buildPhase: resources
      - path: engine/ingest
        type: folder
        buildPhase: resources
    postBuildScripts:
      - name: Embed Python Runtime
        script: exec "$SRCROOT/scripts/embed_python_runtime.sh" ingest
        basedOnDependencyAnalysis: false
      # LGPL ffmpeg/ffprobe from scripts/build_ffmpeg.sh -> Contents/Helpers (skipped if not built)
      - name: Embed ffmpeg
        script: exec "$SRCROOT/scripts/embed_ffmpeg.sh"
        basedOnDependencyAnalysis: false

targets:
  SuperJoy Slating Workstation:
    templates: [SlateApp]
    settings:
      base:
        PRODUCT_NAME: "SuperJoy Slating Workstation"
        PRODUCT_BUNDLE_IDENTIFIER: com.superjoy.slatingworkstation.native
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SW_DEFAULT_THEME: superjoy

  MSTR-SL8R:
    templates: [SlateApp]
    settings:
      base:
        PRODUCT_NAME: "MSTR-SL8R"
        PRODUCT_BUNDLE_IDENTIFIER: com.benfoxmedia.mstrsl8r.native
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-MSTR
        SW_DEFAULT_THEME: mstr_sl8r

  MSTR-SL8R Ingest:
    templates: [IngestApp]
    settings:
      base:
        PRODUCT_NAME: "MSTR-SL8R Ingest"
        PRODUCT_BUNDLE_IDENTIFIER: com.benfoxmedia.mstrsl8r.ingest
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-MSTR
        SW_DEFAULT_THEME: mstr_sl8r
